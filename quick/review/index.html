<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1e9" />
    <title>晒评价</title>
    <link rel="stylesheet" href="/review/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="brand">
        <span class="brand-mark">晒</span>
        <div>
          <strong>晒评价</strong>
          <span>确认收货后自动晒图评价，N 天后自动追评</span>
        </div>
        <nav class="nav">
          <a href="/">拍单</a>
          <a href="/review" class="active">晒评价</a>
        </nav>
      </header>

      <section class="card">
        <div class="status-bar">
          <span class="dot" id="runDot"></span>
          <div>
            <b id="runState">加载中…</b>
            <div class="muted" id="runHint">正在读取任务状态</div>
          </div>
          <div style="margin-left:auto; display:flex; gap:8px;">
            <button class="btn small" id="importBtn">同步已收货订单</button>
            <button class="btn small" id="checkNowBtn">立即巡检</button>
            <button class="btn small" id="toggleBtn">暂停自动检查</button>
          </div>
        </div>
        <div class="chips">
          <div class="chip">待收货<b id="statConfirm">0</b></div>
          <div class="chip">待评价<b id="statReview">0</b></div>
          <div class="chip">待追评<b id="statFollowup">0</b></div>
          <div class="chip">已完成<b id="statDone">0</b></div>
          <div class="chip">需处理<b id="statAttention">0</b></div>
        </div>
      </section>

      <section class="card">
        <h2 id="formTitle">新建晒评价任务</h2>
        <form id="taskForm" autocomplete="off">
          <input type="hidden" id="taskId" />
          <div class="row">
            <label class="field">
              <span>订单号</span>
              <input id="orderId" placeholder="淘宝订单号，例如 3456789012345678901" required />
            </label>
            <label class="field">
              <span>商品标题（可选）</span>
              <input id="orderTitle" placeholder="方便自己核对" />
            </label>
          </div>
          <div class="field">
            <span>商品链接 + 规格值（可选，抓主图和 SKU 图用）</span>
            <div style="display:flex; gap:8px;">
              <input id="itemUrl" placeholder="https://item.taobao.com/item.htm?id=..." style="flex:2;" />
              <input id="sku1" placeholder="规格值1，如 白色" style="flex:1;" />
              <input id="sku2" placeholder="规格值2，如 M" style="flex:1;" />
              <button class="btn" id="fetchImagesBtn" type="button">抓取主图/SKU图</button>
            </div>
            <small class="muted">会先按规格值选中 SKU，再抓主图和 SKU 图，抓到后自动放进「首次评价晒图」。</small>
          </div>

          <div class="group">
            <h3 class="group-title">首次评价</h3>
            <label class="field">
              <span>评价文字</span>
              <textarea id="content" placeholder="例如：东西不错，包装完整，和描述一致。"></textarea>
            </label>
            <div class="field" style="margin-bottom:0;">
              <span>首次评价晒图（最多 5 张）</span>
              <div class="drop" id="reviewDrop">点击或拖拽图片到这里</div>
              <input type="file" id="reviewInput" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden />
              <div class="thumbs" id="reviewThumbs"></div>
            </div>
          </div>

          <div class="group">
            <h3 class="group-title">追评</h3>
            <div class="row">
              <label class="field">
                <span>追评文字</span>
                <textarea id="followupContent" placeholder="例如：用了一周，依然很好用，推荐。"></textarea>
              </label>
              <label class="field" style="max-width:170px;">
                <span>评价后几天追评</span>
                <input id="followupDays" type="number" min="0" max="180" value="3" />
              </label>
            </div>
            <div class="field" style="margin-bottom:0;">
              <span>追评晒图（最多 5 张）</span>
              <div class="drop" id="followupDrop">点击或拖拽图片到这里</div>
              <input type="file" id="followupInput" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden />
              <div class="thumbs" id="followupThumbs"></div>
            </div>
          </div>
          <div style="display:flex; gap:10px;">
            <button class="btn primary" id="saveBtn" type="submit">保存任务</button>
            <button class="btn" id="resetFormBtn" type="button">清空</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>任务列表</h2>
        <div class="tasks" id="tasks"><div class="empty">还没有任务</div></div>
      </section>

      <section class="card">
        <details class="settings">
          <summary>调度设置</summary>
          <div class="settings-grid">
            <label class="field"><span>默认追评天数</span><input id="setFollowupDays" type="number" min="0" max="180" /></label>
            <label class="field"><span>每小时最多执行</span><input id="setHourly" type="number" min="1" max="100" /></label>
            <label class="field"><span>每天最多执行</span><input id="setDaily" type="number" min="1" max="500" /></label>
          </div>
          <p class="muted" style="margin:10px 0 0;">不做定时巡检：每次打开这个页面会自动检查一次，也可以点「立即巡检」手动触发。</p>
          <div style="margin-top:10px;"><button class="btn small" id="saveSettingsBtn">保存设置</button></div>
        </details>
      </section>

      <div class="toast" id="toast"></div>
    </main>
    <script src="/review/app.js"></script>
  </body>
</html>
